<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Áreas y Parkings | Campings & Áreas</title>

  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <header>
    <h1>
      <img src="logo.png" alt="Campings & Áreas" class="logo">
      Campings & Áreas
    </h1>
  </header>


  <nav class="menu">

    <a href="index.html">
      🏠 Inicio
    </a>

    <a href="campings.html">
      🏕️ Campings
    </a>

    <a href="areas.html?tipo=area">
      🚐 Áreas
    </a>

    <a href="areas.html?tipo=parking">
      🅿️ Parkings
    </a>

    <a href="acampadas.html">
      🥾 Acampadas
    </a>

    <a href="lugares.html">
      📍 Lugares
    </a>

    <a href="servicios.html">
      🔧 Servicios
    </a>

  </nav>


  <main>

    <section class="bienvenida">

      <h2 id="tituloAreas">
        🚐 Áreas
      </h2>

      <p id="textoAreas">
        Encuentra áreas y parkings para tus viajes.
      </p>

      <p class="estado">
        Busca por nombre, localidad, provincia o región
        y utiliza los filtros para encontrar el lugar que necesitas.
      </p>

    </section>


    <section class="buscador">

      <h2>
        🔎 Buscar
      </h2>


      <div class="buscador-campos">

        <input
          type="text"
          id="buscarArea"
          placeholder="Nombre, localidad, provincia o región"
        >


        <select id="paisArea">

          <option value="">
            🌍 Todos los países
          </option>

                   <option value="España">
            🇪🇸 España
          </option>

          <option value="Italia">
            🇮🇹 Italia
          </option>

          <option value="Portugal">
            🇵🇹 Portugal
          </option>
<option value="Francia">
  🇫🇷 Francia
</option>
          <option value="Alemania">
  🇩🇪 Alemania
</option>
        </select>


        <select id="regionArea">

          <option value="">
            Todas las regiones
          </option>

        </select>


        <button
          type="button"
          id="botonBuscarArea"
        >
          Buscar
        </button>

      </div>


      <div class="filtros-camping">

        <label>
          <input
            type="radio"
            name="tipoArea"
            value="area"
            checked
          >
          🚐 Áreas
        </label>

        <label>
          <input
            type="radio"
            name="tipoArea"
            value="parking"
          >
          🅿️ Parkings
        </label>

      </div>


      <div class="filtros-camping">

        <label>
          <input
            type="checkbox"
            id="filtroCaravanas"
          >
          🚐 Admite caravanas
        </label>

        <label>
          <input
            type="checkbox"
            id="filtroMascotasArea"
          >
          🐕 Admite mascotas
        </label>

        <label>
          <input
            type="checkbox"
            id="filtroElectricidadArea"
          >
          ⚡ Electricidad
        </label>

        <label>
          <input
            type="checkbox"
            id="filtroAguaArea"
          >
          💧 Agua
        </label>

      </div>


      <div class="acciones-filtros">

        <button
          type="button"
          id="limpiarFiltrosArea"
        >
          Limpiar filtros
        </button>

      </div>

    </section>


    <section
      id="resultadosAreas"
      class="resultados-campings">
    </section>

  </main>


<script src="areas.js?v=11"></script>

</body>

</html>
