<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campings | Campings & Áreas</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <header>
    <h1>
      <img src="logo.png" alt="Campings & Áreas" class="logo">
      Campings & Áreas
    </h1>
  </header>

  <nav class="menu">
    <a href="index.html">🏠 Inicio</a>
    <a href="campings.html">🏕️ Campings</a>
    <a href="#">🚐 Áreas</a>
    <a href="#">🅿️ Parkings</a>
    <a href="#">📍 Lugares</a>
    <a href="#">🔧 Servicios</a>
  </nav>

  <main>

    <section class="bienvenida">
      <h2>🏕️ Campings</h2>

      <p>
        Encuentra campings para tus próximas rutas, escapadas y vacaciones.
      </p>

      <p class="estado">
        Busca por nombre, localidad, provincia o comunidad autónoma y combina los filtros según tus necesidades.
      </p>
    </section>

    <section class="buscador">
      <h2>🔎 Buscar campings</h2>

      <div class="buscador-campos">

        <input
          type="text"
          id="buscarCamping"
          placeholder="Camping, localidad, provincia o comunidad autónoma"
        >

        <select id="paisCamping">
          <option value="">Todos los países</option>
          <option value="ES">🇪🇸 España</option>
        </select>

        <button type="button" id="botonBuscarCamping">
          Buscar
        </button>

      </div>

      <div class="filtros-camping">

        <label>
          <input type="checkbox" id="filtroMascotas">
          🐕 Admite mascotas
        </label>

        <label>
          <input type="checkbox" id="filtroTodoAno">
          📅 Abierto todo el año
        </label>

        <label>
          <input type="checkbox" id="filtroPiscina">
          🏊 Piscina climatizada/cubierta
        </label>

        <label>
          <input type="checkbox" id="filtroAcuatico">
          🌊 Parque acuático/toboganes
        </label>

      </div>

    </section>

    <section
      id="resultadosCampings"
      class="resultados-campings">
    </section>

  </main>

  <script src="campings.js?v=8"></script>

</body>
</html>
